x-healthcheck-postgres: &healthcheck-postgres
  test: ["CMD-SHELL", "pg_isready -U foodlink -d foodlink_pos"]
  interval: 5s
  timeout: 3s
  retries: 5

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8200:8200"
    env_file: ./.env
    environment:
      - DB_URL=postgresql+asyncpg://foodlink:foodlink@postgres:5432/foodlink_pos
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8200); c.request('GET','/health'); r=c.getresponse(); exit(0) if r.status==200 else exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    env_file: ./.env
    environment:
      POSTGRES_USER: foodlink
      POSTGRES_PASSWORD: foodlink
      POSTGRES_DB: foodlink_pos
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: *healthcheck-postgres
    restart: unless-stopped

  api-dev:
    build:
      context: .
      target: development
    profiles:
      - dev
    env_file: ./.env
    environment:
      - DB_URL=postgresql+asyncpg://foodlink:foodlink@postgres:5432/foodlink_pos
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [""]
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
