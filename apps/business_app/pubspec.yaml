name: foodlink_business
description: "FoodLink Business App — mobile POS, inventory, and staff management for African food businesses."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State management (Riverpod 3.x with code generation) ──────────
  flutter_riverpod: ^3.3.2
  riverpod_annotation: 4.0.3

  # ── Routing ───────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ── Local database (Drift + SQLCipher encryption) ─────────────────
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # ── Networking ────────────────────────────────────────────────────
  dio: ^5.9.2

  # ── Immutable models / sealed classes ─────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ── Secure storage ────────────────────────────────────────────────
  flutter_secure_storage: ^10.3.1

  # ── Network state detection ───────────────────────────────────────
  connectivity_plus: ^7.3.1

  # ── Background sync ──────────────────────────────────────────────
  workmanager: ^0.9.0+3

  # ── Adaptive layout (mobile / tablet / desktop) ──────────────────
  flutter_adaptive_scaffold: ^0.3.3+1

  # ── Biometric / PIN lock ─────────────────────────────────────────
  local_auth: ^3.0.2

  # ── UUID generation ──────────────────────────────────────────────
  uuid: ^4.5.3

  # ── Environment config ───────────────────────────────────────────
  flutter_dotenv: ^6.0.1

  # ── Path provider (for Drift database path) ──────────────────────
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code generators ──────────────────────────────────────────────
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.32.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - .env
